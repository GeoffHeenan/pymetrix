name: references

# The help pages' references against Crossref (scripts/check_references.py): a DOI must resolve to a work whose title
# matches the citation; references without a DOI get a suggested one in the run's summary, to check and add by hand.
# Weekly and on demand, not on every push: it depends on Crossref being up.
on:
  workflow_dispatch:
    inputs:
      metadata:
        description: "Also print Crossref's year, journal, volume, issue and pages for each reference"
        type: boolean
        default: false
  schedule:
    - cron: "0 8 * * 1"  # Mondays, 08:00 UTC

# The token reads the repository and nothing more: no step pushes, comments or publishes (artifacts and caches
# need no repository write access).
permissions:
  contents: read

jobs:
  check:
    name: references against Crossref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install with every optional library
        run: python -m pip install -e ".[all]" -e packages/pymetrix-finance -e packages/pymetrix-labbook -e packages/pymetrix-seasonal
      - name: Check the references
        run: python scripts/check_references.py ${{ inputs.metadata && '--metadata' || '' }}
